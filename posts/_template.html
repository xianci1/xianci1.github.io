<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文章标题 - 我的学习博客</title>
  <meta name="description" content="文章摘要，会显示在搜索结果里。">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="post">
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="../index.html">我的学习博客</a>
      <nav class="site-nav" id="siteNav">
        <a href="../index.html" data-nav="home">首页</a>
        <a href="../posts.html" data-nav="posts">文章</a>
        <a href="../categories.html" data-nav="categories">分类</a>
        <a href="../tags.html" data-nav="tags">标签</a>
        <a href="../about.html" data-nav="about">关于</a>
        <a href="../friends.html" data-nav="friends">友链</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" id="searchBtn" title="搜索 (Ctrl+K)" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M21 21l-4.3-4.3"></path>
          </svg>
        </button>
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container article">
    <!-- 使用说明：
         1. 把本文件复制为 posts/文章名.html（建议用英文或拼音文件名）
         2. 把 data-slug 改成唯一标识（建议和文件名一致）
         3. 替换 .article-body 里的正文
         4. 在 js/data.js 的 posts 数组里加一条记录
    -->
    <article data-slug="your-post-slug">
      <header class="article-head">
        <h1>文章标题</h1>
        <div class="post-meta article-meta"></div>
      </header>

      <div class="article-body">
        <p>在这里写正文。</p>
        <h2>小节标题</h2>
        <p>正文内容。</p>
        <pre><code>在这里写代码</code></pre>
      </div>
    </article>
    <nav class="post-nav" id="postNav"></nav>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="footerYear"></span> <span id="footerName">你的名字</span> · 纯静态博客 · <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></p>
    </div>
  </footer>

  <div class="search-overlay" id="searchOverlay" hidden>
    <div class="search-box">
      <div class="search-head">
        <input id="searchInput" type="text" placeholder="输入关键词搜索文章…" autocomplete="off">
        <button class="icon-btn" id="searchCloseBtn" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>
      </div>
      <div class="search-tags" id="searchHotTags"></div>
      <ul class="search-results" id="searchResults"></ul>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>
